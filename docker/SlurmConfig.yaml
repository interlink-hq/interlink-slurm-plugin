SidecarPort: "4000"
Socket: ""
SbatchPath: "/usr/bin/sbatch"
ScancelPath: "/usr/bin/scancel"
SqueuePath: "/usr/bin/squeue"
SinfoPath: "/usr/bin/sinfo"
CommandPrefix: ""
SingularityPrefix: ""
SingularityPath: "singularity"
ExportPodData: true
DataRootFolder: ".local/interlink/jobs/"
Namespace: "vk"
Tsocks: false
TsocksPath: "$WORK/tsocks-1.8beta5+ds1/libtsocks.so"
TsocksLoginNode: "login01"
BashPath: /bin/bash
VerboseLogging: true
ErrorsOnlyLogging: false
ContainerRuntime: singularity
EnrootDefaultOptions: ["--rw"]
EnrootPrefix: ""
EnrootPath: enroot

# Per-pod socket directories for interLink's shadow tunnel: each job creates
# <SocketDirRoot>/<12 hex digits of the pod UID>, mode 0700, and exports it as
# INTERLINK_SOCKET_DIR. Use a shared filesystem that ssh sessions on the compute
# node also see (not a node-local /tmp), at most 79 bytes, writable by this
# account only. Leave it unset when jobs run under more than one UID
# (DefaultUID, flavor UID or runAsUser): a job that cannot write the root fails.
# SocketDirRoot: "/shared/interlink/sockets"

# UID (User ID) configuration - set the user ID for SLURM jobs
# RFC: https://github.com/interlink-hq/interlink-slurm-plugin/discussions/58
# DefaultUID: 1000                # Optional: Set a default UID for all jobs
#                                 # Can be overridden per-pod using spec.securityContext.runAsUser

# Flavor configuration - predefined sets of SLURM submission options
DefaultFlavor: "default"
Flavors:
  default:
    Name: "default"
    Description: "Standard CPU job (2 cores, 8GB RAM)"
    CPUDefault: 2
    MemoryDefault: "8G"
    SlurmFlags:
      - "--partition=normal"

  gpu-nvidia:
    Name: "gpu-nvidia"
    Description: "GPU job with NVIDIA GPU (4 cores, 32GB RAM, 1 GPU)"
    CPUDefault: 4
    MemoryDefault: "32G"
    SlurmFlags:
      - "--gres=gpu:1"
      - "--partition=gpu"
